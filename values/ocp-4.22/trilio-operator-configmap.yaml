# OCP 4.22 profile — T4K operator source for the install-trilio policy.
# Since T4K 5.4.0 GA (2026-08-17) certified-operators ships k8s-triliovault for
# OCP 4.22 (channel 5.4.x), so no custom CatalogSource is needed any more.
# (Until then this profile used Trilio's RC grpc index quay.io/triliovault/k8s-triliovault-catalog.)
# Apply on the ACM hub (default ns).
#
# CONFIRM channel + CSV against the target cluster's certified catalog:
#   oc get packagemanifest k8s-triliovault -n openshift-marketplace \
#     -o jsonpath='{range .status.channels[*]}{.name}={.currentCSV}{"\n"}{end}'
# Verified on dc11 (OCP 4.22.1) 2026-10-05: 5.4.x=k8s-triliovault-stable.5.4.0
#
# Switching an existing cluster from the RC catalog: after applying this, delete the
# orphan CatalogSource k8s-triliovault-manifest (musthave does not prune it).
kind: ConfigMap
apiVersion: v1
metadata:
  name: trilio-operator-configmap
  namespace: default
data:
  # Stock Red Hat certified catalog — the OperatorHub path.
  catalogSource: 'certified-operators'
  # Empty ⇒ the policy does NOT create a custom CatalogSource (OperatorHub only).
  catalogSourceImage: ''
  channel: '5.4.x'
  startingCSV: 'k8s-triliovault-stable.5.4.0'
